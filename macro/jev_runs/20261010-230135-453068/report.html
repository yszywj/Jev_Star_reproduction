 row.records.forEach(record=>{const section=document.createElement('details');section.append(text('summary',`${record.event} · 原日志第 ${record.line} 行`),text('pre',JSON.stringify(record,null,2)));$('detail-body').append(section)});$('detail').showModal();
}
function render(){
 const q=$('search').value.toLowerCase(),owner=$('owner').value,outcome=$('outcome').value,from=$('from').value,to=$('to').value;
 filtered=data.decisions.filter(r=>(!owner||r.owner===owner)&&(!outcome||(outcome==='problems'?!['wait','orders_submitted','plan_accepted'].includes(r.status):r.status===outcome))&&(!q||`${r.id} ${r.description} ${r.reason||''} ${r.plan_id??''} ${r.execution_plan_id??''}`.toLowerCase().includes(q))&&(from===''||r.game_seconds>=Number(from))&&(to===''||r.game_seconds<=Number(to)));
 page=Math.min(page,Math.max(0,Math.ceil(filtered.length/pageSize)-1));$('rows').replaceChildren();
 filtered.slice(page*pageSize,(page+1)*pageSize).forEach(r=>{const tr=document.createElement('tr');[clock(r.game_seconds),r.id,r.description||r.action_id||'—',labels[r.status]||r.status,`${r.plan_id??'—'} → ${r.execution_plan_id??'—'}`,r.latency_ms===null?'—':`${fmt(r.latency_ms)} ms`,fmt(r.input_tokens),r.cost_usd===null?'未估算':fmt(r.cost_usd,7)].forEach(v=>tr.append(text('td',v)));const td=document.createElement('td'),button=text('button','查看');button.addEventListener('click',()=>show(r));td.append(button);tr.append(td);$('rows').append(tr)});
 $('count').textContent=`${filtered.length} 条 · 第 ${page+1} / ${Math.max(1,Math.ceil(filtered.length/pageSize))} 页`;$('prev').disabled=page===0;$('next').disabled=(page+1)*pageSize>=filtered.length;
}
['search','owner','outcome','from','to'].forEach(id=>$(id).addEventListener('input',()=>{page=0;render()}));$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('close-detail').onclick=()=>$('detail').close();render();

if(data.issues.length)$('issues').append(text('pre',JSON.stringify(data.issues,null,2)));
